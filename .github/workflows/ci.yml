name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: `cache: pnpm` shells out to pnpm to locate
      # the store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      # Runs `astro check` first, so this covers type errors too.
      - run: pnpm build
