<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Bit compression 8-bit word strips showing bitwise AND set intersection">
  <!-- Clean warm-paper ground -->
  <rect width="640" height="400" fill="#faf9f6"/>

  <!-- Whisper-soft vertical highlight on the 3 matching columns (cols 0, 3, 7) -->
  <!-- 8 cells x: 98, 162, 226, 290, 354, 418, 482, 546 (w=56, gap=8, end=602) -->
  <g fill="#1f6f78" opacity="0.08">
    <rect x="92" y="55" width="68" height="290" rx="10"/>
    <rect x="284" y="55" width="68" height="290" rx="10"/>
    <rect x="540" y="55" width="68" height="290" rx="10"/>
  </g>

  <!-- Minimal left labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="56" y="98" fill="#2b6a4b">A</text>
    <text x="56" y="172" fill="#c46d2d">B</text>
    <text x="56" y="235" fill="#57544d">&amp;</text>
    <text x="56" y="304" fill="#1f6f78">∩</text>
  </g>

  <!-- Row A: 1 0 1 1 0 1 0 1 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <rect x="98" y="69" width="56" height="56" rx="7" fill="#e3f0e9" stroke="#bcd8c9" stroke-width="1.8"/>
    <text x="126" y="98" fill="#2b6a4b">1</text>

    <rect x="162" y="69" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="190" y="98" fill="#c0bbb1">0</text>

    <rect x="226" y="69" width="56" height="56" rx="7" fill="#e3f0e9" stroke="#bcd8c9" stroke-width="1.8"/>
    <text x="254" y="98" fill="#2b6a4b">1</text>

    <rect x="290" y="69" width="56" height="56" rx="7" fill="#e3f0e9" stroke="#bcd8c9" stroke-width="1.8"/>
    <text x="318" y="98" fill="#2b6a4b">1</text>

    <rect x="354" y="69" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="382" y="98" fill="#c0bbb1">0</text>

    <rect x="418" y="69" width="56" height="56" rx="7" fill="#e3f0e9" stroke="#bcd8c9" stroke-width="1.8"/>
    <text x="446" y="98" fill="#2b6a4b">1</text>

    <rect x="482" y="69" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="510" y="98" fill="#c0bbb1">0</text>

    <rect x="546" y="69" width="56" height="56" rx="7" fill="#e3f0e9" stroke="#bcd8c9" stroke-width="1.8"/>
    <text x="574" y="98" fill="#2b6a4b">1</text>
  </g>

  <!-- Row B: 1 1 0 1 0 0 1 1 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <rect x="98" y="143" width="56" height="56" rx="7" fill="#f9ece0" stroke="#e5c6aa" stroke-width="1.8"/>
    <text x="126" y="172" fill="#c46d2d">1</text>

    <rect x="162" y="143" width="56" height="56" rx="7" fill="#f9ece0" stroke="#e5c6aa" stroke-width="1.8"/>
    <text x="190" y="172" fill="#c46d2d">1</text>

    <rect x="226" y="143" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="254" y="172" fill="#c0bbb1">0</text>

    <rect x="290" y="143" width="56" height="56" rx="7" fill="#f9ece0" stroke="#e5c6aa" stroke-width="1.8"/>
    <text x="318" y="172" fill="#c46d2d">1</text>

    <rect x="354" y="143" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="382" y="172" fill="#c0bbb1">0</text>

    <rect x="418" y="143" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="446" y="172" fill="#c0bbb1">0</text>

    <rect x="482" y="143" width="56" height="56" rx="7" fill="#f9ece0" stroke="#e5c6aa" stroke-width="1.8"/>
    <text x="510" y="172" fill="#c46d2d">1</text>

    <rect x="546" y="143" width="56" height="56" rx="7" fill="#f9ece0" stroke="#e5c6aa" stroke-width="1.8"/>
    <text x="574" y="172" fill="#c46d2d">1</text>
  </g>

  <!-- Clean hairline operator divider -->
  <line x1="98" y1="235" x2="602" y2="235" stroke="#262522" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Row A & B: 1 0 0 1 0 0 0 1 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <rect x="98" y="275" width="56" height="56" rx="7" fill="#1f6f78"/>
    <text x="126" y="304" fill="#faf9f6">1</text>

    <rect x="162" y="275" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="190" y="304" fill="#c0bbb1">0</text>

    <rect x="226" y="275" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="254" y="304" fill="#c0bbb1">0</text>

    <rect x="290" y="275" width="56" height="56" rx="7" fill="#1f6f78"/>
    <text x="318" y="304" fill="#faf9f6">1</text>

    <rect x="354" y="275" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="382" y="304" fill="#c0bbb1">0</text>

    <rect x="418" y="275" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="446" y="304" fill="#c0bbb1">0</text>

    <rect x="482" y="275" width="56" height="56" rx="7" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.6"/>
    <text x="510" y="304" fill="#c0bbb1">0</text>

    <rect x="546" y="275" width="56" height="56" rx="7" fill="#1f6f78"/>
    <text x="574" y="304" fill="#faf9f6">1</text>
