<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Parallel Binary Search binary tree showing queries splitting across a shared depth level">
  <!-- Clean warm-paper ground -->
  <rect width="640" height="400" fill="#faf9f6"/>

  <!-- Single soft horizontal band highlighting one shared level sweep -->
  <rect x="48" y="166" width="544" height="72" rx="10" fill="#edf4f0" stroke="#cfe1d7" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Straight binary tree edges -->
  <g fill="none" stroke-width="2.8" stroke-linecap="round">
    <!-- Left subtree (forest green) -->
    <line x1="320" y1="92" x2="196" y2="202" stroke="#2b6a4b"/>
    <line x1="196" y1="202" x2="124" y2="312" stroke="#2b6a4b"/>
    <line x1="196" y1="202" x2="268" y2="312" stroke="#2b6a4b"/>

    <!-- Right subtree (burnt amber) -->
    <line x1="320" y1="92" x2="444" y2="202" stroke="#c46d2d"/>
    <line x1="444" y1="202" x2="372" y2="312" stroke="#c46d2d"/>
    <line x1="444" y1="202" x2="516" y2="312" stroke="#c46d2d"/>
  </g>

  <!-- Root node [1, M]: 4 queries grouped together -->
  <g>
    <rect x="256" y="72" width="128" height="40" rx="20" fill="#ffffff" stroke="#262522" stroke-width="2.2"/>
    <circle cx="284" cy="92" r="8.5" fill="#2b6a4b"/>
    <circle cx="308" cy="92" r="8.5" fill="#7ba891"/>
    <circle cx="332" cy="92" r="8.5" fill="#da9f73"/>
    <circle cx="356" cy="92" r="8.5" fill="#c46d2d"/>
  </g>

  <!-- Depth-1 nodes: queries split into [1, M/2] and (M/2, M] -->
  <g>
    <rect x="158" y="182" width="76" height="40" rx="20" fill="#ffffff" stroke="#2b6a4b" stroke-width="2.2"/>
    <circle cx="184" cy="202" r="8.5" fill="#2b6a4b"/>
    <circle cx="208" cy="202" r="8.5" fill="#7ba891"/>

    <rect x="406" y="182" width="76" height="40" rx="20" fill="#ffffff" stroke="#c46d2d" stroke-width="2.2"/>
    <circle cx="432" cy="202" r="8.5" fill="#da9f73"/>
    <circle cx="456" cy="202" r="8.5" fill="#c46d2d"/>
  </g>

  <!-- Depth-2 leaf nodes: individual answers (opaque fills so edges terminate cleanly) -->
  <g>
    <circle cx="124" cy="312" r="14" fill="#2b6a4b" stroke="#faf9f6" stroke-width="3"/>
    <circle cx="268" cy="312" r="14" fill="#7ba891" stroke="#faf9f6" stroke-width="3"/>
    <circle cx="372" cy="312" r="14" fill="#da9f73" stroke="#faf9f6" stroke-width="3"/>
    <circle cx="516" cy="312" r="14" fill="#c46d2d" stroke="#faf9f6" stroke-width="3"/>
  </g>

  <!-- Minimal mathematical range labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" fill="#57544d">
    <text x="320" y="54" text-anchor="middle" fill="#262522">[1, M]</text>
    <text x="142" y="207" text-anchor="end">[1, M/2]</text>
    <text x="498" y="207" text-anchor="start">(M/2, M]</text>
  </g>
</svg>
