<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Auxiliary Tree highlighting query vertices, LCA vertices, and compressed edges over a pruned host tree">
  <defs>
    <pattern id="aux-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#dce2da"/>
    </pattern>
  </defs>

  <!-- Clean warm-paper canvas matching the rest of the series -->
  <rect width="640" height="400" fill="#faf9f6"/>
  <rect width="640" height="400" fill="url(#aux-dots)"/>

  <!-- Compact top-left legend card -->
  <g>
    <rect x="24" y="24" width="136" height="82" rx="8" fill="#ffffff" stroke="#d5ddd4" stroke-width="1.6"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#3a403a" dominant-baseline="central">
      <circle cx="44" cy="44" r="6.5" fill="#c46d2d"/>
      <text x="59" y="45">QUERY</text>

      <circle cx="44" cy="66" r="6.5" fill="#2b6a4b"/>
      <text x="59" y="67">LCA</text>

      <line x1="36" y1="88" x2="52" y2="88" stroke="#1f6f78" stroke-width="4" stroke-linecap="round"/>
      <text x="59" y="89">VIRTUAL</text>
    </g>
  </g>

  <!-- Pruned original tree edges (dashed muted stone) -->
  <g fill="none" stroke="#b5beb2" stroke-width="2.8" stroke-dasharray="6 6" stroke-linecap="round">
    <line x1="210" y1="154" x2="144" y2="246"/>
    <line x1="144" y1="246" x2="94" y2="338"/>
    <line x1="144" y1="246" x2="188" y2="338"/>
    <line x1="274" y1="246" x2="274" y2="338"/>
    <line x1="454" y1="154" x2="376" y2="246"/>
  </g>

  <!-- Kept auxiliary tree edges (charcoal ink) -->
  <g fill="none" stroke="#262522" stroke-width="4" stroke-linecap="round">
    <line x1="332" y1="68" x2="210" y2="154"/>
    <line x1="332" y1="68" x2="454" y2="154"/>
    <line x1="210" y1="154" x2="274" y2="246"/>
    <line x1="454" y1="154" x2="454" y2="246"/>
    <line x1="454" y1="154" x2="554" y2="246"/>
  </g>

  <!-- Compressed virtual shortcut edge 2 -> 9 (skipping pruned node 4) -->
  <path d="M 210 154 C 98 166, 56 238, 94 338" fill="none" stroke="#faf9f6" stroke-width="11" stroke-linecap="round"/>
  <path d="M 210 154 C 98 166, 56 238, 94 338" fill="none" stroke="#1f6f78" stroke-width="5" stroke-linecap="round"/>

  <!-- Pruned host-tree nodes (4, 6, 10, 11) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <circle cx="144" cy="246" r="18" fill="#eceee9" stroke="#a2aba0" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="144" y="247" fill="#7d867a">4</text>

    <circle cx="376" cy="246" r="18" fill="#eceee9" stroke="#a2aba0" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="376" y="247" fill="#7d867a">6</text>

    <circle cx="188" cy="338" r="18" fill="#eceee9" stroke="#a2aba0" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="188" y="339" fill="#7d867a">10</text>

    <circle cx="274" cy="338" r="18" fill="#eceee9" stroke="#a2aba0" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="274" y="339" fill="#7d867a">11</text>
  </g>

  <!-- Added LCA vertices (1, 2, 3) in Forest Green -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <circle cx="332" cy="68" r="28" fill="#2b6a4b" opacity="0.16"/>
    <circle cx="332" cy="68" r="21" fill="#2b6a4b" stroke="#faf9f6" stroke-width="3"/>
    <text x="332" y="69" fill="#faf9f6">1</text>

    <circle cx="210" cy="154" r="28" fill="#2b6a4b" opacity="0.16"/>
    <circle cx="210" cy="154" r="21" fill="#2b6a4b" stroke="#faf9f6" stroke-width="3"/>
    <text x="210" y="155" fill="#faf9f6">2</text>

    <circle cx="454" cy="154" r="28" fill="#2b6a4b" opacity="0.16"/>
    <circle cx="454" cy="154" r="21" fill="#2b6a4b" stroke="#faf9f6" stroke-width="3"/>
    <text x="454" y="155" fill="#faf9f6">3</text>
  </g>

  <!-- Query vertices (5, 7, 8, 9) in Burnt Amber -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <circle cx="274" cy="246" r="28" fill="#c46d2d" opacity="0.16"/>
    <circle cx="274" cy="246" r="21" fill="#c46d2d" stroke="#faf9f6" stroke-width="3"/>
    <text x="274" y="247" fill="#faf9f6">5</text>

    <circle cx="454" cy="246" r="28" fill="#c46d2d" opacity="0.16"/>
    <circle cx="454" cy="246" r="21" fill="#c46d2d" stroke="#faf9f6" stroke-width="3"/>
    <text x="454" y="247" fill="#faf9f6">7</text>

    <circle cx="554" cy="246" r="28" fill="#c46d2d" opacity="0.16"/>
    <circle cx="554" cy="246" r="21" fill="#c46d2d" stroke="#faf9f6" stroke-width="3"/>
    <text x="554" y="247" fill="#faf9f6">8</text>

    <circle cx="94" cy="338" r="28" fill="#c46d2d" opacity="0.16"/>
    <circle cx="94" cy="338" r="21" fill="#c46d2d" stroke="#faf9f6" stroke-width="3"/>
    <text x="94" y="339" fill="#faf9f6">9</text>
  </g>
</svg>
